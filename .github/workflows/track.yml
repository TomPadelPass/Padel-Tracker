name: Track padel bookings

on:
  schedule:
    - cron: "50 * * * *"   # every hour at :50 (UTC); captures state just before each hour ends
  workflow_dispatch:        # allows manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Run scraper
        run: python scraper.py

      - name: Commit data
        run: |
          git config user.name "padel-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +'%Y-%m-%d %H:%M')"
          git push
